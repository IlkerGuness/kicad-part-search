name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.9 = KiCad 10 on macOS (the oldest supported), 3.11 = KiCad 10 on Windows
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Static check
        run: |
          python -m pip install --disable-pip-version-check pyflakes==3.2.0
          python -m pyflakes partsearch tests tools kicad_plugin
      - name: Unit tests (no wx, no network; library tests are skipped without fixtures)
        run: python -m unittest discover -s tests -v
      - name: Build the plugin folder
        run: python tools/build_plugin.py
